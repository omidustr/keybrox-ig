name: KeyBrox Instagram yayin

on:
  schedule:
    # Tam saatte (0 8 / 0 16) tetiklenme 27 Agu'da iki kez 3+ saat gecikti
    # (11:00 -> 14:16, 19:00 -> 22:35). GitHub tam-saat noktalarini en yogun
    # aninlar olarak belgeliyor, rastgele bir dakikaya kaydirmayi oneriyor.
    # Simdi :07/:22/:37/:52'de, hedef saatten sonraki ~4 saat boyunca tekrar
    # dener; publish.py kuyrukta is yoksa aninda cikar (idempotent), bu
    # yuzden fazladan tetiklenme guvenlidir ve cift gonderi yapmaz.
    - cron: '7,22,37,52 8-11 * * *'    # 11:07-14:52 Turkiye saati
    - cron: '7,22,37,52 16-19 * * *'   # 19:07-22:52 Turkiye saati
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Deneme modu (hicbir sey yayinlanmaz)'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: instagram-yayin
  cancel-in-progress: false

jobs:
  yayinla:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Yayinla
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: python3 publish.py

      - name: Durumu kaydet
        if: success()
        run: |
          if git diff --quiet state/durum.json; then
            echo "Degisiklik yok."
          else
            git config user.name  "keybrox-bot"
            git config user.email "bot@users.noreply.github.com"
            git add state/durum.json
            git commit -m "Yayin durumu guncellendi [skip ci]"
            git push
          fi
