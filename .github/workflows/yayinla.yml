name: KeyBrox Instagram yayin

on:
  schedule:
    # 31 Agu 2026: 4 saatlik pencere (7,22,37,52 x 4 saat = ~16 deneme/hedef)
    # gunluk sinir OLMADIGI icin sirali kuyrugu 30 gunluk yerine 2 gunde
    # tuketti, ardindan Meta tarafinda art arda hata basladi (muhtemelen hiz
    # siniri). Artik publish.py'de "gunde en fazla 2 set" kilidi VAR — asiri
    # tetiklenme artik zararsiz — ama pencere yine de dar tutuluyor ki
    # Actions gunlugu havai fisek gibi gorunmesin. Hedeften sonraki ~50 dk
    # icinde 3 deneme (:07/:27/:47), tam saatte degil (GitHub'in en yogun
    # oldugu nokta).
    - cron: '7,27,47 8 * * *'    # 11:07-11:47 Turkiye saati
    - cron: '7,27,47 16 * * *'   # 19:07-19:47 Turkiye saati
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Deneme modu (hicbir sey yayinlanmaz)'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: instagram-yayin
  cancel-in-progress: false

jobs:
  yayinla:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Yayinla
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: python3 publish.py

      - name: Durumu kaydet
        if: success()
        run: |
          if git diff --quiet state/durum.json; then
            echo "Degisiklik yok."
          else
            git config user.name  "keybrox-bot"
            git config user.email "bot@users.noreply.github.com"
            git add state/durum.json
            git commit -m "Yayin durumu guncellendi [skip ci]"
            git push
          fi
